<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 260" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="50%" stop-color="#06080d"/>
      <stop offset="100%" stop-color="#0a0f1d"/>
    </linearGradient>

    <!-- Ambient Glowing Highlights -->
    <radialGradient id="glow-cyan" cx="15%" cy="20%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#080a0f" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="glow-purple" cx="85%" cy="30%" r="50%">
      <stop offset="0%" stop-color="#818cf8" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#080a0f" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="glow-emerald" cx="50%" cy="95%" r="60%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#080a0f" stop-opacity="0"/>
    </radialGradient>

    <!-- Fine Matrix Dot Pattern -->
    <pattern id="grid-dots" x="0" y="0" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#ffffff" fill-opacity="0.04"/>
    </pattern>

    <!-- Gradient Text -->
    <linearGradient id="text-gradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="70%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#94a3b8"/>
    </linearGradient>

    <linearGradient id="cyan-gradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>

    <filter id="subtle-shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <style>
    .font-mono { font-family: 'JetBrains Mono', Consolas, Monaco, monospace; }
    .font-sans { font-family: 'Space Grotesk', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
    .pulse-dot { animation: pulse 2s infinite ease-in-out; }
    @keyframes pulse {
      0%, 100% { opacity: 0.9; transform: scale(1); }
      50% { opacity: 0.4; transform: scale(0.9); }
    }
  </style>

  <!-- Card Base -->
  <rect width="960" height="260" rx="16" fill="url(#bg-grad)" stroke="#30363d" stroke-width="1.2" filter="url(#subtle-shadow)"/>
  <rect width="960" height="260" rx="16" fill="url(#glow-cyan)"/>
  <rect width="960" height="260" rx="16" fill="url(#glow-purple)"/>
  <rect width="960" height="260" rx="16" fill="url(#glow-emerald)"/>
  <rect width="960" height="260" rx="16" fill="url(#grid-dots)"/>

  <!-- Top Window Header Bar -->
  <line x1="0" y1="46" x2="960" y2="46" stroke="#ffffff" stroke-opacity="0.08" stroke-width="1"/>

  <!-- Window Controls -->
  <circle cx="28" cy="23" r="6" fill="#ff5f56" stroke="#e0443e" stroke-width="0.5"/>
  <circle cx="48" cy="23" r="6" fill="#ffbd2e" stroke="#dea123" stroke-width="0.5"/>
  <circle cx="68" cy="23" r="6" fill="#27c93f" stroke="#1aab29" stroke-width="0.5"/>

  <!-- Breadcrumb / Host Badge -->
  <text x="96" y="27" fill="#64748b" font-size="13" font-weight="600" class="font-mono">guts1005@edge-node: ~ (main)</text>

  <!-- Live Status Badge -->
  <g transform="translate(830, 14)">
    <rect width="102" height="22" rx="11" fill="#10b981" fill-opacity="0.12" stroke="#10b981" stroke-opacity="0.3" stroke-width="1"/>
    <circle cx="16" cy="11" r="4" fill="#10b981" class="pulse-dot"/>
    <text x="27" y="15" fill="#34d399" font-size="11" font-weight="700" class="font-mono" letter-spacing="1">SYSTEMS ON</text>
  </g>

  <!-- Main Headline -->
  <text x="36" y="112" fill="url(#text-gradient)" font-size="44" font-weight="800" class="font-sans" letter-spacing="-0.8">SHARVIN NEVE</text>

  <!-- Subtitle Tagline -->
  <text x="36" y="146" fill="url(#cyan-gradient)" font-size="19" font-weight="700" class="font-mono" letter-spacing="0.5">Systems Software &amp; AI Infrastructure Engineer</text>

  <!-- Micro Bio Line -->
  <text x="36" y="178" fill="#94a3b8" font-size="14.5" font-weight="500" class="font-sans">
    Integrated B.Tech + MBA @ NMIMS MPSTME · Contributing Upstream to <tspan fill="#38bdf8" font-weight="700">vLLM</tspan> &amp; <tspan fill="#38bdf8" font-weight="700">SGLang</tspan>
  </text>

  <!-- Bottom Tech Tags Strip -->
  <g transform="translate(36, 204)">
    <!-- Pill 1: C++20 -->
    <rect x="0" y="0" width="70" height="26" rx="6" fill="#1e293b" fill-opacity="0.75" stroke="#334155" stroke-width="1"/>
    <text x="35" y="17" fill="#38bdf8" font-size="12" font-weight="700" class="font-mono" text-anchor="middle">C++20</text>

    <!-- Pill 2: Distributed LLM Inference -->
    <rect x="78" y="0" width="186" height="26" rx="6" fill="#1e293b" fill-opacity="0.75" stroke="#334155" stroke-width="1"/>
    <text x="171" y="17" fill="#cbd5e1" font-size="12" font-weight="600" class="font-mono" text-anchor="middle">Distributed LLM Inference</text>

    <!-- Pill 3: Edge Fleet Telemetry -->
    <rect x="272" y="0" width="160" height="26" rx="6" fill="#1e293b" fill-opacity="0.75" stroke="#334155" stroke-width="1"/>
    <text x="352" y="17" fill="#cbd5e1" font-size="12" font-weight="600" class="font-mono" text-anchor="middle">Edge Fleet Telemetry</text>

    <!-- Pill 4: WebRTC -->
    <rect x="440" y="0" width="78" height="26" rx="6" fill="#1e293b" fill-opacity="0.75" stroke="#334155" stroke-width="1"/>
    <text x="479" y="17" fill="#34d399" font-size="12" font-weight="700" class="font-mono" text-anchor="middle">WebRTC</text>

    <!-- Pill 5: Linux Kernel / POSIX -->
    <rect x="526" y="0" width="148" height="26" rx="6" fill="#1e293b" fill-opacity="0.75" stroke="#334155" stroke-width="1"/>
    <text x="600" y="17" fill="#cbd5e1" font-size="12" font-weight="600" class="font-mono" text-anchor="middle">Linux Kernel / POSIX</text>

    <!-- Pill 6: PyTorch & Python -->
    <rect x="682" y="0" width="138" height="26" rx="6" fill="#1e293b" fill-opacity="0.75" stroke="#334155" stroke-width="1"/>
    <text x="751" y="17" fill="#c084fc" font-size="12" font-weight="600" class="font-mono" text-anchor="middle">PyTorch &amp; Python</text>
  </g>

  <!-- Minimal Decorative Bracket / Accent in bottom right -->
  <path d="M 910 200 L 924 200 L 924 224 L 900 224" fill="none" stroke="#38bdf8" stroke-width="1.5" stroke-opacity="0.4"/>
</svg>
